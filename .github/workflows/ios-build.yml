name: iOS build

# Builds the Kinshasabouge iOS app (ios/Kinshasabouge/) on macOS runners.
# No secrets are needed: both jobs build UNSIGNED (CODE_SIGNING_ALLOWED=NO).
# An unsigned build cannot install on a real iPhone — the simulator job is
# compile verification only, and the .ipa artifact is for inspection.
# App Store signing is added later, once the owner's Apple Developer
# account exists — see the commented section at the bottom.

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

jobs:
  simulator-smoke-test:
    name: Simulator smoke test
    runs-on: macos-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for testing (iOS Simulator, unsigned)
        run: |
          xcodebuild build-for-testing \
            -project ios/Kinshasabouge/Kinshasabouge.xcodeproj \
            -scheme Kinshasabouge \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

  unsigned-archive:
    name: Unsigned archive (.ipa)
    runs-on: macos-latest
    needs: simulator-smoke-test
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project ios/Kinshasabouge/Kinshasabouge.xcodeproj \
            -scheme Kinshasabouge \
            -destination 'generic/platform=iOS' \
            -archivePath build/Kinshasabouge.xcarchive \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned .ipa
        run: |
          APP_PATH="build/Kinshasabouge.xcarchive/Products/Applications/Kinshasabouge.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Kinshasabouge-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Kinshasabouge-unsigned-ipa
          path: Kinshasabouge-unsigned.ipa
          if-no-files-found: error

